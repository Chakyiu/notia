# Notia MCP server.
#
#   cd docker/mcp
#   cp .env.example .env
#   # set NOTIA_MCP_TOKEN and NOTIA_VAULT in .env
#   docker compose up --build -d
#
# Point an MCP client at http://127.0.0.1:8788/mcp with
# Authorization: Bearer <NOTIA_MCP_TOKEN>.
#
# The published port is localhost only. Inside the container the process
# listens on 0.0.0.0 so that published port can reach it. The token is the
# only password. Locked notes (anything without frontmatter `unlocked: true`)
# are not served.

services:
  mcp:
    build:
      context: ../..
      dockerfile: docker/mcp/Dockerfile
    image: notia-mcp
    user: "${NOTIA_UID:-0}:${NOTIA_GID:-0}"
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      NOTIA_MCP_TOKEN: ${NOTIA_MCP_TOKEN:?set NOTIA_MCP_TOKEN in docker/mcp/.env}
    volumes:
      - ${NOTIA_VAULT:?set NOTIA_VAULT in docker/mcp/.env}:/vault
    command: ["--vault", "/vault", "--listen", "0.0.0.0:8788"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
