[workspace]
resolver = "3"
# `crates` holds the app and its core plugins.
members = ["crates/*"]
default-members = ["crates/notia"]

[workspace.package]
version = "0.2.10"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
notia-core = { path = "crates/notia-core" }
notia-theme = { path = "crates/notia-theme" }
notia-plugin = { path = "crates/notia-plugin" }
notia-workspace = { path = "crates/notia-workspace" }
notia-plugins = { path = "crates/notia-plugins" }
notia-js = { path = "crates/notia-js" }
notia-sync = { path = "crates/notia-sync", default-features = false }

gpui-kit = { version = "=0.10.0", features = [
    "tree-sitter-markdown",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-python",
    "tree-sitter-bash",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-go",
] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
env_logger = "0.11"
log = "0.4"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

# GPUI renders far too slowly unoptimized; these crates dominate frame time.
[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }

[profile.release]
strip = "symbols"

# Context menus in gpui-component 0.10.0 put only 4px between an icon and its label.
[patch.crates-io]
gpui-component = { path = "third_party/gpui-component" }
